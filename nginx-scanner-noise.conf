# Классификация scanner-шума для s21_agent_edge.
# Подключается через include в http-контексте (nginx.conf и HTTP-шаблон в
# nginx-entrypoint.sh), чтобы правила не расходились между TLS и TLS_DISABLED.
#
# $scanner_probe — известная probe-сигнатура, считается по $request_uri
#   (в отличие от $uri сохраняет ведущие двойные слэши сканеров) и доступна
#   на этапе rewrite, поэтому по ней рубим соединение (444).
# $scanner_hit   — итоговая метка для access_log: probe ИЛИ 404 на путь,
#   которого у сервиса нет. Считается на этапе логирования ($status готов).
# $app_traffic   — инверсия $scanner_hit, для чистого основного лога.

log_format s21_main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

map $request_uri $scanner_probe {
    default 0;

    # Корень и «браузерные» пути: у API их нет, ходят только сканеры и боты.
    "/"                                                                       1;
    "/favicon.ico"                                                            1;
    "/robots.txt"                                                             1;

    # Ведущий двойной слэш — сигнатура массовых WordPress-сканеров.
    "~^//"                                                                    1;

    # WordPress и PHP: сервиса на PHP здесь нет вообще.
    "~*/wp-(admin|content|includes|login|json|config|cron|signup|comments-post)"  1;
    "~*(wlwmanifest\.xml|xmlrpc|wordpress|setup-config\.php)"                  1;
    "~*\.php([/?]|$)"                                                         1;
    "~*\.(asp|aspx|jsp|jspa|cgi|pl|cfm)([/?]|$)"                              1;

    # Секреты, конфиги, дампы.
    "~*(^|/)\.(env|git|aws|svn|hg|ssh|npmrc|bash_history|dockerenv|vscode|idea|DS_Store)([/.]|$)"  1;
    "~*(^|/)env([./?]|$)"                                                     1;
    "~*/\.config/"                                                            1;
    "~*(credential|service-?account|firebase|gcp-|google-(key|credentials)|application_default_credentials)"  1;
    "~*/(key|keyfile|sa|secret|secrets|config|settings|credentials)\.json([?]|$)"  1;
    "~*\.(sql|bak|old|swp|zip|rar|7z|tgz|tar|tar\.gz|sql\.gz)([?]|$)"         1;

    # Админки, чужие движки, типовые RCE/LFI-пробы.
    "~*/(phpmyadmin|pma|myadmin|mysqladmin|adminer|administrator|admin\.php|phpinfo|_profiler|server-status|server-info|cgi-bin|actuator|solr|jenkins|struts|cfide|shell|telescope|owa|autodiscover|ecp|boaform|hudson|HNAP1|dana-na|geoserver|webui|console|debug)([/?]|$)"  1;
    "~*/vendor/(phpunit|composer)"                                            1;

    # Прочий типовой мусор чужих стеков.
    "~*/(web\.config|\.htaccess|composer\.(json|lock)|package(-lock)?\.json|docker-compose\.ya?ml|Dockerfile|ads\.txt)([?]|$)"  1;
    "~*/sitemap[^/]*\.xml"                                                    1;
    "~*/\.well-known/(traffic-advice|security\.txt)"                          1;
}

# Реальные маршруты сервиса (FastAPI + edge). Всё остальное с 404 — probe.
map $uri $known_app_path {
    default 0;
    "~^/(ask|health|healthz|nginx-health|docs|redoc|openapi\.json)(/|$)" 1;
}

# 404/400/414 на путь, которого у сервиса нет: остальные пробы сканеров и
# мусорные запросы (например TLS ClientHello в plain-HTTP порт — у них $uri пуст).
map "$known_app_path:$status" $unknown_404 {
    default   0;
    "0:404"   1;
    "0:400"   1;
    "0:414"   1;
}

map "$scanner_probe$unknown_404" $scanner_hit {
    default 1;
    "00"    0;
}

map $scanner_hit $app_traffic {
    default 1;
    "1"     0;
}
